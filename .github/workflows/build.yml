name: build and test

on: [push, pull_request]

env:
  FORCE_COLOR: 1

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # The sonic pad and other common printers runs 3.7, so it's important to keep it here to make sure all of our required dependencies work
        # We use 3.7.13 because it's the oldest version available on ubuntu-22.04. https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json
        python-version: ['3.7.13', '3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
        # We must limit the OS to ubuntu-22.04 instead of the default ubuntu-latest, to keep PY3.7 available.
        os: [ubuntu-22.04]
    steps:
      - name: Check out source repository
        uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }} environment
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/setup.py', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-
      - name: Run local websockets echo server on port ${{ env.LOCAL_WS_SERVER_PORT }} (code is for Python 3.7+)
        run: |
          pip3 install -U websockets asyncio
          python3 octowebsocket/tests/echo-server.py &
      - name: Install build tools and print setuptools version
        run: |
          pip3 install -U pip setuptools wheel readme_renderer twine pytest python-socks build
          python3 -c "import setuptools; print('Setup tools version'); print(setuptools.__version__)"
      # - name: Run tests
      #   run: |
      #     pytest octowebsocket/tests -v -r f
      #   env:
      #     TEST_WITH_INTERNET: 1
      #     LOCAL_WS_SERVER_PORT: 8765
      - name: Build websocket-client and check with twine
        run: |
          python -m build
          twine check dist/*
